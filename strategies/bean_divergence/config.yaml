# Bean fair value (Kalman crush) research. See README for the current state and decisions.
data_path: data/raw/latest_df_backup.parquet     # same 1-minute ZS/ZM/ZL file as the crush strategy

split:
  development_start: 2021-01-01
  holdout_start: 2024-12-01        # locked before any result was looked at
  holdout_end: null

research:
  bar_minutes: 5
  z_half_life_bars: 48             # adaptive z: gap / its 4-hour exponential RMS
  trigger_z: 1.645                 # one trigger per move: the first bar with |z| >= this
  rearm_z: 0.6745                  # the same side can fire again only after |z| is back inside this
  cost_ticks: 1.0                  # ZS round trip
